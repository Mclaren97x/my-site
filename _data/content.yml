services:
  eyebrow: Services
  heading: What I shoot
  items:
    - title: Rolling shoots
      text: Car-to-car motion photography with sharp subjects and blurred backgrounds
        that make your car look fast standing still.
    - title: Private commissions
      text: A dedicated shoot for your car at locations picked to match its character,
        from city streets at night to open back roads.
    - title: Shops & dealerships
      text: Clean, consistent listing and build-showcase photos that sell cars and
        show off the work that went into them.
    - title: Events & meets
      text: Coverage of car meets, shows and track days, delivered fast so you can
        post while the event is still trending.
process:
  eyebrow: How it works
  heading: From first message to final edits
  steps:
    - title: Plan
      text: Tell me about your car and the look you're after. We pick a location, time
        and shot list together.
    - title: Shoot
      text: We meet on location. Rolling shots, statics and details, at the light that
        suits your car best.
    - title: Edit
      text: Every selected photo is hand-edited for color, reflections and clean
        backgrounds.
    - title: Deliver
      text: You get a private online gallery with full-resolution downloads, ready for
        print and social.
about:
  photo: /images/me.jpg
  eyebrow: About
  heading: The person behind the lens
  paragraphs:
    - My name's Jaxon, and I'm the photographer! I've loved cars my whole life,
      and it's turned into a love of photographing them! I chase the designs,
      light, and motion that makes each car special.
    - Whether it's a daily driver you love, a build years in the making or a
      showroom lineup, I'll make it look as good on screen as it does in person.
  button: Work with me
contact:
