nav_label: UTMedia
seo_title: UTMedia
seo_description: UTMedia is a community for photographers of all mediums across Utah, sponsored by Cars,
  Bikes & Bites (CBB).
banner: /images/salt-flats-sunset.jpg
eyebrow: Community
heading: UTMedia
tagline: Built for photographers, by photographers.
intro: UTMedia is a community built for photographers, by photographers, across the state of Utah. It's
  a safe space for photographers of every medium to give and receive feedback, show off their work, and
  connect with each other.
sponsor:
  label: Sponsored by
  name: Cars, Bikes & Bites (CBB)
  link: https://carsbikesnbites.com/
about_paragraphs:
- UTMedia is sponsored by Cars, Bikes & Bites (CBB). We operate inside an Instagram group chat, and we
  have our own section within the CBB Discord server.
- I'm one of UTMedia's managers. Even though I and many of our members shoot cars, the goal is to include
  all mediums, so everyone is welcome.
platforms_heading: Where we meet
platforms:
- icon: instagram
  title: Instagram group chat
  text: UTMedia runs inside an Instagram group chat.
- icon: discord
  title: CBB Discord server
  text: We have our own UTMedia section within the Cars, Bikes & Bites Discord.
pillars_eyebrow: What we're about
pillars_heading: Why UTMedia
pillars:
- icon: feedback
  title: Give & receive feedback
  text: Share your work and get honest, constructive feedback from people who shoot too, and help others
    grow along the way.
- icon: showcase
  title: Show off your work
  text: A place to put your best shots in front of people who appreciate the craft.
- icon: connect
  title: Connect with photographers
  text: Meet other photographers across Utah, trade ideas, and find people to shoot with.
- icon: camera
  title: All mediums welcome
  text: 'Many of us, me included, shoot cars, but UTMedia is for every medium: portraits, landscapes,
    film, digital, video. If you create, you belong here.'
